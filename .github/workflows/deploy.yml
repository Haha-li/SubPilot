name: Deploy to Cloudflare

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Workers
    runs-on: ubuntu-latest
    outputs:
      workers_url: ${{ steps.get-url.outputs.url }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Build and test backend
        run: |
          npm run build
          npm run typecheck:workers
          npm test
          npm audit

      - name: Validate authentication secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --import tsx -e "const { assertAuthConfiguration } = require('./src/utils/securityConfig.ts'); assertAuthConfiguration({ jwtSecret: process.env.JWT_SECRET, adminPassword: process.env.ADMIN_PASSWORD });"

      - name: Generate wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS }}
        run: |
          FRONTEND_ORIGINS="${FRONTEND_ORIGINS:-https://subpilot-frontend.pages.dev}"
          cat > wrangler.toml << TOML
          name = "subpilot"
          main = "src/hono/index.ts"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          [vars]
          FRONTEND_ORIGINS = "$FRONTEND_ORIGINS"

          [[d1_databases]]
          binding = "DB"
          database_name = "subpilot"
          database_id = "$D1_DATABASE_ID"

          [triggers]
          crons = ["* * * * *"]
          TOML

      - name: Set JWT_SECRET
        run: printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set ADMIN_PASSWORD
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 migration
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0001_init.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 migration 0002
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0002_add_price.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0003
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0003_add_price_unit.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0004
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0004_add_notify_log_content.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0005
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0005_add_is_pinned.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0006
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0006_add_trial_fields.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0007
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0007_add_currency.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0009
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0009_create_renewal_logs.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0011
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0011_add_non_self_paid.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0012
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0012_add_non_self_paid_unit.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0013
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0013_create_common_subscriptions.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 migration 0014
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0014_add_common_subscription_background.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0015
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0015_add_subscription_icon_url.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0016
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0016_add_subscription_icon_background.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0017
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0017_add_renewal_source.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0018
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0018_add_renewal_previous_expiry.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0019
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0019_add_renewal_new_expiry.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Run D1 migration 0020
        run: npx wrangler d1 execute subpilot --remote --file=migrations/0020_add_renewal_periods_advanced.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Deploy to Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Get Workers URL
        id: get-url
        run: |
          SUBDOMAIN=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq -r '.result.subdomain')
          echo "url=https://subpilot.${SUBDOMAIN}.workers.dev/api" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy Pages
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Build frontend
        run: |
          npm run build
          npm run check:bundle
          npm audit
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.workers_url }}

      - name: Create Pages project
        run: |
          npx wrangler pages project create subpilot-frontend --production-branch master 2>&1 || \
          echo "Project already exists, skipping creation"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Pages
        run: npx wrangler pages deploy dist --project-name=subpilot-frontend --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
