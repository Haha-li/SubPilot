# 本地开发用。GitHub Actions 部署时会从 Secrets 动态生成此文件。
name = "subpilot"
main = "src/hono/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发与 Android APK 来源。生产环境请保留 https://localhost，并添加实际 Web 域名。
[vars]
FRONTEND_ORIGINS = "http://localhost:5173,https://localhost"

[[d1_databases]]
binding = "DB"
database_name = "subpilot"
database_id = "YOUR_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]
