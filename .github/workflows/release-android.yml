name: Release Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-android:
    name: Sign and release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci --include=dev

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$GITHUB_WORKSPACE/SubPilot-${GITHUB_REF_NAME}.apk" >> "$GITHUB_ENV"

      - name: Resolve Workers API URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SUBDOMAIN=$(curl --fail-with-body --silent --show-error -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -er '.result.subdomain | select(type == "string" and length > 0)')
          echo "VITE_API_URL=https://subpilot.${SUBDOMAIN}.workers.dev/api" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing GitHub Secret: ${variable}"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/subpilot-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded signing key is empty"
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build frontend and sync Android
        run: npm run android:sync

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleRelease \
            -PsubpilotVersionCode="$ANDROID_VERSION_CODE" \
            -PsubpilotVersionName="$ANDROID_VERSION_NAME"

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED_APK="$PWD/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/SubPilot-aligned.apk"
          CERTIFICATE="$PWD/android/signing/subpilot-release-cert.pem"
          if [[ ! -f "$UNSIGNED_APK" ]]; then
            echo "::error::Unsigned release APK not found: $UNSIGNED_APK"
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RELEASE_APK" \
            "$ALIGNED_APK"

          VERIFY_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK")
          printf '%s\n' "$VERIFY_OUTPUT"
          EXPECTED_CERT_SHA256=$(openssl x509 -in "$CERTIFICATE" -outform DER | sha256sum | awk '{print $1}')
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')
          if [[ -z "$ACTUAL_CERT_SHA256" || "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signer certificate does not match the pinned certificate"
            exit 1
          fi

          PACKAGE_LINE=$("$BUILD_TOOLS/aapt" dump badging "$RELEASE_APK" | head -n 1)
          printf '%s\n' "$PACKAGE_LINE"
          if [[ "$PACKAGE_LINE" != *"name='com.subpilot.app'"* ]]; then
            echo "::error::Unexpected Android application ID"
            exit 1
          fi
          if [[ "$PACKAGE_LINE" != *"versionCode='$ANDROID_VERSION_CODE'"* ]]; then
            echo "::error::Unexpected Android versionCode"
            exit 1
          fi
          if [[ "$PACKAGE_LINE" != *"versionName='$ANDROID_VERSION_NAME'"* ]]; then
            echo "::error::Unexpected Android versionName"
            exit 1
          fi

          cd "$(dirname "$RELEASE_APK")"
          sha256sum "$(basename "$RELEASE_APK")" > "$(basename "$RELEASE_APK").sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_APK.sha256" \
              --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_APK" \
            "$RELEASE_APK.sha256" \
            --verify-tag \
            --title "SubPilot $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
